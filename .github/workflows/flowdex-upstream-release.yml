name: Flowdex upstream release

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: Official Codex release tag to integrate (latest stable when omitted)
        required: false
        type: string

permissions:
  actions: read
  contents: write
  issues: write

concurrency:
  group: flowdex-upstream-release
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'QuinnISHE/flowdex'
    runs-on: ubuntu-latest
    outputs:
      base_sha: ${{ steps.sync.outputs.base_sha }}
      branch: ${{ steps.sync.outputs.branch }}
      build: ${{ steps.sync.outputs.build }}
      release_tag: ${{ steps.sync.outputs.release_tag }}
      upstream_tag: ${{ steps.sync.outputs.upstream_tag }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - id: sync
        name: Merge the latest official Codex release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.upstream_tag }}
        run: |
          set -euo pipefail
          upstream_tag="${REQUESTED_TAG:-}"
          if [[ -z "$upstream_tag" ]]; then
            upstream_tag="$(gh api repos/openai/codex/releases/latest --jq .tag_name)"
          fi

          release_tag="flowdex-$upstream_tag"
          safe_tag="$(printf '%s' "$upstream_tag" | sed 's/[^A-Za-z0-9._-]/-/g')"
          branch="automation/flowdex-$safe_tag"
          base_sha="$(git rev-parse HEAD)"

          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "upstream_tag=$upstream_tag" >> "$GITHUB_OUTPUT"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config merge.renormalize true
          git fetch --no-tags https://github.com/openai/codex.git \
            "refs/tags/$upstream_tag:refs/tags/$upstream_tag"

          if git merge-base --is-ancestor "$upstream_tag" HEAD \
            && gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "blocked=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git switch -C "$branch" "$base_sha"
          set +e
          git merge --no-commit --no-ff "$upstream_tag"
          merge_status=$?
          set -e

          if [[ $merge_status -ne 0 ]]; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            {
              echo "## Upstream merge conflicts"
              echo
              echo "Flowdex could not automatically integrate official Codex \`$upstream_tag\`."
              echo
              echo "- Flowdex base: \`$base_sha\`"
              echo "- Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
              echo "- Conflicting files: ${#conflicts[@]}"
              echo
              printf -- '- `%s`\n' "${conflicts[@]}"
              echo
              echo "Resolve by merging \`$upstream_tag\` into current \`main\`, preserving both current upstream behavior and Flowdex integration points. Push the resolution to \`main\`; the next scheduled run will build and publish it automatically."
            } > "$RUNNER_TEMP/flowdex-sync-failure.md"
            git merge --abort
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "blocked=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git rev-parse -q --verify MERGE_HEAD >/dev/null; then
            git commit -m "Merge official Codex $upstream_tag into Flowdex"
          fi
          git merge-base --is-ancestor "$upstream_tag" HEAD
          git push --force-with-lease origin "HEAD:refs/heads/$branch"
          echo "build=true" >> "$GITHUB_OUTPUT"
          echo "blocked=false" >> "$GITHUB_OUTPUT"

      - name: Report an unresolved upstream merge
        if: steps.sync.outputs.blocked == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_TAG: ${{ steps.sync.outputs.upstream_tag }}
        run: |
          set -euo pipefail
          title="Flowdex upstream sync blocked: $UPSTREAM_TAG"
          issue="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "$title in:title" --json number --jq '.[0].number // empty')"
          if [[ -n "$issue" ]]; then
            gh issue comment "$issue" --repo "$GITHUB_REPOSITORY" \
              --body-file "$RUNNER_TEMP/flowdex-sync-failure.md"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" \
              --body-file "$RUNNER_TEMP/flowdex-sync-failure.md"
          fi

      - name: Stop when the upstream merge needs adaptation
        if: steps.sync.outputs.blocked == 'true'
        run: exit 1

  build:
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            binary: codex.exe
            package: flowdex-windows-x64.zip
          - name: macos-arm64
            runner: macos-15
            target: aarch64-apple-darwin
            binary: codex
            package: flowdex-macos-arm64.tar.gz
          - name: macos-x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            binary: codex
            package: flowdex-macos-x64.tar.gz
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.prepare.outputs.branch }}

      - name: Install the repository Rust toolchain and target
        shell: bash
        run: |
          rustup show
          rustup target add "${{ matrix.target }}"

      - uses: ./.github/actions/setup-rusty-v8
        with:
          target: ${{ matrix.target }}

      - name: Build release binary
        working-directory: codex-rs
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cargo build --release --target "${{ matrix.target }}" \
              -p codex-cli --bin codex \
              -p codex-code-mode-host --bin codex-code-mode-host \
              -p codex-windows-sandbox --bin codex-windows-sandbox-setup \
              -p codex-windows-sandbox --bin codex-command-runner
          else
            cargo build --release --target "${{ matrix.target }}" \
              -p codex-cli --bin codex \
              -p codex-code-mode-host --bin codex-code-mode-host
          fi

      - name: Package Windows binaries
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "codex-rs/target/${{ matrix.target }}/release/${{ matrix.binary }}" dist/flowdex.exe
          Copy-Item "codex-rs/target/${{ matrix.target }}/release/codex-code-mode-host.exe" dist/
          Copy-Item "codex-rs/target/${{ matrix.target }}/release/codex-windows-sandbox-setup.exe" dist/
          Copy-Item "codex-rs/target/${{ matrix.target }}/release/codex-command-runner.exe" dist/
          Compress-Archive -Path dist/* -DestinationPath "${{ matrix.package }}"

      - name: Package macOS binary
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p dist
          cp "codex-rs/target/${{ matrix.target }}/release/${{ matrix.binary }}" dist/flowdex
          cp "codex-rs/target/${{ matrix.target }}/release/codex-code-mode-host" dist/
          chmod +x dist/flowdex dist/codex-code-mode-host
          tar -C dist -czf "../${{ matrix.package }}" flowdex codex-code-mode-host

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.package }}

  report-build-failure:
    needs: [prepare, build]
    if: >-
      ${{
        always()
        && needs.prepare.result == 'success'
        && needs.prepare.outputs.build == 'true'
        && needs.build.result == 'failure'
      }}
    runs-on: ubuntu-latest
    steps:
      - name: Open or update the failed-build issue
        shell: bash
        env:
          BRANCH: ${{ needs.prepare.outputs.branch }}
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_TAG: ${{ needs.prepare.outputs.upstream_tag }}
        run: |
          set -euo pipefail
          title="Flowdex upstream build blocked: $UPSTREAM_TAG"
          log="$RUNNER_TEMP/flowdex-build-failures.log"
          gh run view "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --log-failed > "$log" || true
          head -c 50000 "$log" > "$RUNNER_TEMP/flowdex-build-failures-bounded.log"
          {
            echo "## Upstream release build failed"
            echo
            echo "The merge completed and is preserved on branch \`$BRANCH\`, but at least one release target failed."
            echo
            echo "- Official Codex release: \`$UPSTREAM_TAG\`"
            echo "- Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            echo '<details><summary>Failed build output</summary>'
            echo
            echo '```text'
            cat "$RUNNER_TEMP/flowdex-build-failures-bounded.log"
            echo '```'
            echo '</details>'
          } > "$RUNNER_TEMP/flowdex-build-failure.md"

          issue="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "$title in:title" --json number --jq '.[0].number // empty')"
          if [[ -n "$issue" ]]; then
            gh issue comment "$issue" --repo "$GITHUB_REPOSITORY" \
              --body-file "$RUNNER_TEMP/flowdex-build-failure.md"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" \
              --body-file "$RUNNER_TEMP/flowdex-build-failure.md"
          fi

  release:
    needs: [prepare, build]
    if: needs.prepare.outputs.build == 'true' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.branch }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: Fast-forward Flowdex and publish the release
        shell: bash
        env:
          BASE_SHA: ${{ needs.prepare.outputs.base_sha }}
          BRANCH: ${{ needs.prepare.outputs.branch }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          UPSTREAM_TAG: ${{ needs.prepare.outputs.upstream_tag }}
        run: |
          set -euo pipefail
          default_branch="${{ github.event.repository.default_branch }}"
          git fetch origin "$default_branch"
          if [[ "$(git rev-parse FETCH_HEAD)" != "$BASE_SHA" ]]; then
            title="Flowdex upstream publication blocked: $UPSTREAM_TAG"
            body="The release builds passed, but \`$default_branch\` moved during the run. The verified integration remains on \`$BRANCH\`. Re-run the workflow after reconciling that branch. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
            exit 1
          fi

          git push origin "HEAD:refs/heads/$default_branch"
          cd artifacts
          sha256sum flowdex-* > SHA256SUMS.txt
          gh release create "$RELEASE_TAG" ./* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$(git -C .. rev-parse HEAD)" \
            --title "Flowdex for $UPSTREAM_TAG" \
            --notes "Flowdex automatically integrated and rebuilt from official Codex $UPSTREAM_TAG. Download the archive for your platform, extract it, and run the included Flowdex binary with install."

          for prefix in \
            "Flowdex upstream sync blocked: $UPSTREAM_TAG" \
            "Flowdex upstream build blocked: $UPSTREAM_TAG" \
            "Flowdex upstream publication blocked: $UPSTREAM_TAG"; do
            gh issue list --repo "$GITHUB_REPOSITORY" --state open \
              --search "$prefix in:title" --json number --jq '.[].number' |
              while read -r issue; do
                gh issue close "$issue" --repo "$GITHUB_REPOSITORY" \
                  --comment "Resolved by successful release $RELEASE_TAG."
              done
          done
          git -C .. push origin --delete "$BRANCH" || true
